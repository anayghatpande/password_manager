name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed `
            --distpath "exported_app" `
            --add-data "vault_core.py;." `
            --add-data "password_generator.py;." `
            --add-data "face_auth.py;." `
            gui_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PasswordVault-${{ github.ref_name }}
          path: exported_app/gui_app.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Password Vault ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: exported_app/gui_app.exe
          draft: false
          prerelease: false
